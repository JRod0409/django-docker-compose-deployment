version: '3.9'

services:
  db:
    image: postgres:13-alpine
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=henrybooks
      - POSTGRES_USER=henry_admin
      - POSTGRES_PASSWORD=henry_secure_pass

  app:
    build:
      context: .
    command: >
      sh -c "until nc -z db 5432; do echo 'Waiting for Postgres...'; sleep 1; done &&
             python manage.py migrate &&
             python manage.py runserver 0.0.0.0:8000"
    ports:
      - "8000:8000"
    volumes:
      - ./app:/app
    environment:
      - DB_HOST=db
      - DB_NAME=henrybooks
      - DB_USER=henry_admin
      - DB_PASS=henry_secure_pass
      - SECRET_KEY=django-insecure-dev-key-change-in-production
      - DJANGO_SETTINGS_MODULE=app.settings
      - PYTHONPATH=/app
    depends_on:
      - db

volumes:
  postgres_data: