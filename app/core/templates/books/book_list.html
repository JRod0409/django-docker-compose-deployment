<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Henry Books - Inventory</title>
</head>
<body>
    <h1>Henry Books Inventory</h1>
    <p><a href="{% url 'book-create' %}">+ Add New Book</a></p>

    <table border="1" cellpadding="8" cellspacing="0">
        <thead>
            <tr>
                <th>Title</th>
                <th>Author</th>
                <th>Price</th>
            </tr>
        </thead>
        <tbody>
            {% for book in books %}
            <tr>
                <td>{{ book.title }}</td>
                <td>{{ book.author }}</td>
                <td>${{ book.price }}</td>
            </tr>
            {% empty %}
            <tr>
                <td colspan="3">No books found in inventory.</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</body>
</html>
